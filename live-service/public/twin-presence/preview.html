<script type="module">
  import './onboarding.mjs';
  document.querySelector('.vcomposer').addEventListener('submit', event => event.preventDefault());
  const workspace = document.querySelector('.twin-root');
  for (const item of workspace.querySelectorAll('[data-twin-item]')) {
    item.addEventListener('click', () => {
      const chosen = item.dataset.twinItem;
      for (const button of workspace.querySelectorAll('[data-twin-item]')) {
        button.setAttribute('aria-pressed', String(button === item));
      }
      for (const content of workspace.querySelectorAll('[data-twin-content]')) {
        content.hidden = content.dataset.twinContent !== chosen;
      }
      workspace.dispatchEvent(new CustomEvent('twin:item-selected', { detail: chosen }));
    });
  }
</script>
