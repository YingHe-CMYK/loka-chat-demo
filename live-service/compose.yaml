services:
  loka:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      TRUST_PROXY_HOPS: 1
      DATABASE_PATH: /app/data/loka.sqlite
    volumes:
      - loka_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8780/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    image: caddy:2
    environment:
      LOKA_DOMAIN: ${LOKA_DOMAIN:?Set the real domain in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - loka
    restart: unless-stopped
volumes:
  loka_data:
  caddy_data:
  caddy_config:
